<!doctype html>
<!--
    Obraz do podglądów linków strony programu partnerskiego (/partnerzy): 1200 × 630 px, jasny motyw netizo.pl.
    Ta sama rama co szablon.html (logo, poziome linie, szyna z nitami, sygnet N ton w ton), podzielona pionową linią
    jak hero strony: po lewej oferta słowami nagłówka hero, po prawej przykład z pasma na stronie głównej (sklep za
    18 000 zł netto, podział 85/15 i prowizja partnera). Kwoty i procenty muszą się zgadzać z partner-data.ts.
    Zmiana ramy w szablon.html (kolory, linie, logo) dotyczy też tego pliku.
    Znaczniki w podwójnych klamrach (logo i sygnet) wypełnia generuj.cjs; nie wpisuj ich w komentarzach, bo wstawione SVG
    zawierają własne komentarze i przedwcześnie zamknęłyby ten.
-->
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>OG image netizo, program partnerski</title>
    <style>
        @font-face {
            font-family: 'Geist';
            font-weight: 400;
            src: url('fonts/geist-400.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Geist';
            font-weight: 600;
            src: url('fonts/geist-600.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Geist Mono';
            font-weight: 400;
            src: url('fonts/geist-mono-400.ttf') format('truetype');
        }

        :root {
            /* Tokeny strony netizo.pl (jasny motyw), jak w szablon.html. */
            --ink: #0a0a0a;
            --paper: #ffffff;
            --muted: #6e6e6e;
            --line: #d6d6d6;
            --rivet: #b3b3b3;
            --mark: #f0f0f0;
            /* Tor paska prowizji: foreground/12 na białym, jak CommissionBar na stronie. */
            --track: #e1e1e1;

            --rail-x: 64px;
            --column-x: 680px;
            --content-x: 104px;
            --example-x: 720px;
            --line-top: 140px;
            --line-bottom: 500px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            background: var(--paper);
            -webkit-font-smoothing: antialiased;
        }

        .canvas {
            position: relative;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Geist', sans-serif;
        }

        /* Wstawione SVG skalują się do wysokości kontenera; overflow: visible chroni zaokrąglone końce N. */
        .svg-fit svg {
            display: block;
            width: auto;
            height: 100%;
            overflow: visible;
        }

        /* Wielki sygnet ton w ton w prawej kolumnie, przycięty prawą krawędzią; linie i przykład leżą na nim. */
        .mark {
            position: absolute;
            left: 700px;
            top: -5px;
            height: 640px;
            color: var(--mark);
        }

        .hairline {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--line);
        }

        .rail {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--line);
        }

        .rivet {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--rivet);
        }

        .logo {
            position: absolute;
            left: var(--content-x);
            top: 34px;
            height: 72px;
            color: var(--ink);
        }

        .headline {
            position: absolute;
            left: var(--content-x);
            top: var(--line-top);
            height: calc(var(--line-bottom) - var(--line-top));
            display: flex;
            align-items: center;
            font-size: 76px;
            font-weight: 600;
            line-height: 1.04;
            letter-spacing: -0.04em;
        }

        .example {
            position: absolute;
            left: var(--example-x);
            right: 64px;
            top: var(--line-top);
            height: calc(var(--line-bottom) - var(--line-top));
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .amount {
            font-size: 96px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
        }

        .order {
            margin: 14px 0 36px;
            font-size: 26px;
            line-height: 1.3;
            color: var(--muted);
        }

        /* Podział 85/15 jak CommissionBar: część Netizo jako tor, 15% partnera wypełnione. */
        .bar {
            display: flex;
            gap: 4px;
            height: 14px;
        }

        .bar span {
            height: 100%;
            background: var(--track);
        }

        .bar .netizo {
            flex: 85;
            border-radius: 999px 0 0 999px;
        }

        .bar .partner {
            flex: 15;
            border-radius: 0 999px 999px 0;
            background: var(--ink);
        }

        .split {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-family: 'Geist Mono', monospace;
            font-size: 20px;
            color: var(--muted);
        }

        .url {
            position: absolute;
            left: var(--content-x);
            top: var(--line-bottom);
            height: calc(630px - var(--line-bottom));
            display: flex;
            align-items: center;
            font-family: 'Geist Mono', monospace;
            font-size: 34px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="mark svg-fit">{{sygnet}}</div>

        <span class="hairline" style="top: calc(var(--line-top) - 1px)"></span>
        <span class="hairline" style="top: calc(var(--line-bottom) - 1px)"></span>
        <span class="rail" style="left: calc(var(--rail-x) - 1px)"></span>
        <span class="rail" style="left: calc(var(--column-x) - 1px)"></span>
        <span class="rivet" style="left: calc(var(--rail-x) - 5px); top: calc(var(--line-top) - 5px)"></span>
        <span class="rivet" style="left: calc(var(--rail-x) - 5px); top: calc(var(--line-bottom) - 5px)"></span>
        <span class="rivet" style="left: calc(var(--column-x) - 5px); top: calc(var(--line-top) - 5px)"></span>
        <span class="rivet" style="left: calc(var(--column-x) - 5px); top: calc(var(--line-bottom) - 5px)"></span>

        <div class="logo svg-fit">{{logo}}</div>

        <p class="headline">Polecasz nas,<br>dostajesz 15%<br>od każdego<br>zamówienia.</p>

        <div class="example">
            <p class="amount">2 700 zł</p>
            <p class="order">Twoja prowizja od sklepu<br>za 18 000 zł netto</p>
            <div class="bar"><span class="netizo"></span><span class="partner"></span></div>
            <p class="split"><span>Netizo 85%</span><span>Twoje 15%</span></p>
        </div>

        <p class="url">netizo.pl/partnerzy</p>
    </div>
</body>
</html>
