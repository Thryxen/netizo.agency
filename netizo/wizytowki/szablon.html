<!doctype html>
<!--
    Wizytówka netizo, 85 × 55 mm + 3 mm spadu (strona 91 × 61 mm): strona 1 przód (osoba), strona 2 tył (marka).
    Karta jak wycinek netizo.pl. Przód: pełne logo, linie od spadu do spadu z nitami, imię i nazwisko, kod QR
    z kontaktem, e-mail i telefon jak pasek statystyk w hero. Tył: ciemny motyw, pełne logo i nagłówek z hero na wielkim
    sygnecie N przyciętym krawędzią karty. Tło obu stron: drobny wzór z sygnetów N, wygaszany w stronę treści; na
    przodzie dochodzi do samego kodu QR. Wzór wypełnia format netto całymi znakami, spad jest gładki.
    Położenia liczymy od linii cięcia: calc(var(--b) + …); treść trzyma się ≥ 4 mm od cięcia.
    Znaczniki w podwójnych klamrach wypełnia generuj.cjs danymi z osoby.json.
-->
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Wizytówka netizo</title>
    <style>
        /* Statyczne kroje Geist (TTF): w PDF trafiają jako zwykłe osadzone fonty TrueType, nie Type 3. */
        @font-face {
            font-family: 'Geist';
            font-weight: 400;
            src: url('fonts/geist-400.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Geist';
            font-weight: 600;
            src: url('fonts/geist-600.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Geist Mono';
            font-weight: 400;
            src: url('fonts/geist-mono-400.ttf') format('truetype');
        }

        @page {
            size: 91mm 61mm;
            margin: 0;
        }

        :root {
            --b: 3mm;
            --hair: 0.15mm;
            --rivet: 1mm;

            /* Tokeny strony netizo.pl (jasny motyw). */
            --ink: #0a0a0a;
            --paper: #ffffff;
            --muted: #6e6e6e;
            --line: #d6d6d6;
            --rivet-color: #b3b3b3;
            /* Najmocniejszy ton wzoru z N, słabsze miesza generator z --paper. */
            --pattern: #ededed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            font-family: 'Geist', sans-serif;
            font-kerning: normal;
            text-rendering: geometricPrecision;
            color: var(--ink);
        }

        .card {
            position: relative;
            width: 91mm;
            height: 61mm;
            overflow: hidden;
            break-after: page;
            background: var(--paper);
            color: var(--ink);
        }

        .card:last-child {
            break-after: auto;
        }

        /* Tył: ciemny motyw strony. */
        .card.dark {
            --ink: #fafafa;
            --paper: #0a0a0a;
            --muted: #a1a1a1;
            --line: #2b2b2b;
            --rivet-color: #4a4a4a;
            --pattern: #1a1a1a;
        }

        /*
         * Wzór z sygnetów N (rysuje go generator, patrz drawPattern w generuj.cjs): 15 × 10 znaków (rozstaw ok. 5,7 × 5,6 mm)
         * rozpiętych na cały format netto, skrajne 1,1 mm od linii cięcia, więc nóż żadnego nie przecina. Przy tej siatce
         * linie karty (15, 39 i 50 mm na przodzie, 15 i 43 mm na tyle) biegną między rzędami i kolumnami znaków.
         */
        .pattern {
            position: absolute;
            inset: 0;
        }

        .pattern__mark {
            position: absolute;
        }

        .mono {
            font-family: 'Geist Mono', monospace;
        }

        /*
         * Linie od spadu do spadu (pozioma i pionowa przegroda) i nity na skrzyżowaniach, jak w sekcjach strony. Rysuje je
         * SVG, a nie tła elementów: Chromium przy druku zaokrągla tła do pełnych pikseli CSS (ok. 0,26 mm), więc nit
         * lądował pół piksela obok środka linii, a linia drukowała się grubsza. Geometria SVG trafia do PDF dokładnie.
         */
        .rules {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .hairline {
            x: 0;
            y: calc(var(--b) + var(--y) - var(--hair) / 2);
            width: 100%;
            height: var(--hair);
            fill: var(--line);
        }

        .divider {
            x: calc(var(--b) + var(--x) - var(--hair) / 2);
            y: 0;
            width: var(--hair);
            height: 100%;
            fill: var(--line);
        }

        .rivet {
            x: calc(var(--b) + var(--x) - var(--rivet) / 2);
            y: calc(var(--b) + var(--y) - var(--rivet) / 2);
            width: var(--rivet);
            height: var(--rivet);
            fill: var(--rivet-color);
        }

        /*
         * Wstawione SVG (logo, sygnet, QR) skalują się do wysokości kontenera. overflow: visible, bo Chromium zaokrągla pole
         * SVG do pikseli i bez tego potrafi uciąć zaokrąglone końce sygnetu N.
         */
        .svg-fit svg {
            display: block;
            width: auto;
            height: 100%;
            overflow: visible;
        }

        /*
         * Tekst, który musi się zmieścić w swoim pudełku (generator zmniejsza go po załadowaniu fontów): e-mail i telefon
         * w jednej linii, data-fit="wrap" (imię i nazwisko) w najwyżej dwóch. text-wrap-style, nie skrót text-wrap, który
         * nadpisałby white-space: nowrap.
         */
        [data-fit] {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-wrap-style: balance;
        }

        .top {
            position: absolute;
            left: calc(var(--b) + 6mm);
            right: calc(var(--b) + 6mm);
            top: var(--b);
            height: 15mm;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Pełne logo ze sloganem: 9 mm wysokości, żeby „software solutions” miało czytelne ~4,5 pt. */
        .logo {
            height: 9mm;
        }

        /* Tył: dwie domeny w jednej linii, szare, rozdzielone ukośnikiem w kolorze nitów. */
        .url {
            display: inline-flex;
            gap: 1.5mm;
            font-size: 5.6pt;
            line-height: 1;
            color: var(--muted);
        }

        .url__sep {
            color: var(--rivet-color);
        }

        .person {
            position: absolute;
            left: calc(var(--b) + 6mm);
            width: 41mm;
            top: calc(var(--b) + 15mm);
            height: 24mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.5mm;
        }

        .name {
            font-size: 15pt;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.035em;
        }

        /* Wizytówka firmowa: nagłówek średniej wielkości, bo pod nim stoi dłuższe zdanie, a nie samo stanowisko. */
        .person--company .name {
            font-size: 12pt;
        }

        .role {
            font-size: 7.5pt;
            line-height: 1.3;
            color: var(--muted);
        }

        .role:empty {
            display: none;
        }

        .qr {
            position: absolute;
            left: calc(var(--b) + 50mm);
            right: var(--b);
            top: calc(var(--b) + 15mm);
            height: 24mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.1mm;
        }

        /*
         * Białe tło tylko pod samym kodem: wzór dochodzi do jego krawędzi, a jasne moduły zostają czyste. Wzór przy kodzie
         * jest na tyle jasny, że skaner bierze go za białą strefę ciszy.
         */
        .qr .svg-fit {
            height: 16.5mm;
            background: var(--paper);
        }

        .qr__caption {
            font-size: 5.6pt;
            line-height: 1;
            color: var(--muted);
        }

        /* Dolne komórki jak pasek statystyk w hero: wartość, pod nią szary podpis. */
        .stat {
            position: absolute;
            top: calc(var(--b) + 39mm);
            height: 16mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1mm;
        }

        .stat--email {
            left: calc(var(--b) + 6mm);
            width: 41mm;
        }

        /* Przód: prawy górny pas z domenami pod sobą, szare, wyrównane do prawego marginesu karty (6 mm od cięcia). */
        .sites {
            position: absolute;
            top: var(--b);
            left: calc(var(--b) + 50mm);
            right: calc(var(--b) + 6mm);
            height: 15mm;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 1.2mm;
        }

        .stat--phone {
            left: calc(var(--b) + 53mm);
            width: 26mm;
        }

        .stat__value {
            font-size: 7.8pt;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .stat__label {
            font-size: 5.8pt;
            line-height: 1.2;
            color: var(--muted);
        }

        /* Tył: wielki sygnet ton w ton, przycięty krawędzią karty; linie biegną po nim. */
        .mark {
            position: absolute;
            left: calc(var(--b) + 41mm);
            top: calc(var(--b) + 5mm);
            height: 53mm;
            color: #242424;
        }

        .back-logo {
            position: absolute;
            left: calc(var(--b) + 6mm);
            top: calc(var(--b) + 3mm);
            height: 9mm;
        }

        .headline {
            position: absolute;
            left: calc(var(--b) + 6mm);
            width: 38mm;
            top: calc(var(--b) + 15mm);
            height: 28mm;
            display: flex;
            align-items: center;
            font-size: 13.5pt;
            font-weight: 600;
            line-height: 1.04;
            letter-spacing: -0.035em;
        }

        .back-url {
            position: absolute;
            left: calc(var(--b) + 6mm);
            top: calc(var(--b) + 43mm);
            height: 12mm;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- Wzorzec znaku dla [data-pattern]; przed kartami, żeby nie psuć .card:last-child. -->
    <template id="sygnet">{{sygnet}}</template>

    <section class="card">
        <div class="pattern" data-pattern data-grid="15 10" data-size="2.4" data-inset="1.1" data-fade="10 0 85 55"></div>

        <svg class="rules">
            <rect class="hairline" style="--y: 15mm" />
            <rect class="hairline" style="--y: 39mm" />
            <rect class="divider" style="--x: 50mm" />
            <rect class="rivet" style="--x: 50mm; --y: 15mm" />
            <rect class="rivet" style="--x: 50mm; --y: 39mm" />
        </svg>

        <div class="top">
            <div class="logo svg-fit">{{logo}}</div>
        </div>

        <div class="sites">
            <span class="url mono">netizo.pl</span>
            <span class="url mono">netizo.agency</span>
        </div>

        <div class="person{{personClass}}">
            <p class="name" data-fit="wrap">{{name}}</p>
            <p class="role">{{role}}</p>
        </div>

        <div class="qr">
            <div class="svg-fit">{{qr}}</div>
            <span class="qr__caption">zapisz kontakt</span>
        </div>

        <div class="stat stat--email">
            <span class="stat__value" data-fit>{{email}}</span>
            <span class="stat__label">e-mail</span>
        </div>

        <div class="stat stat--phone">
            <span class="stat__value" data-fit>{{phone}}</span>
            <span class="stat__label">telefon</span>
        </div>
    </section>

    <section class="card dark">
        <div class="pattern" data-pattern data-grid="15 10" data-size="2.4" data-inset="1.1" data-fade="0 0 85 55"></div>
        <div class="mark svg-fit">{{sygnet}}</div>

        <svg class="rules">
            <rect class="hairline" style="--y: 15mm" />
            <rect class="hairline" style="--y: 43mm" />
        </svg>

        <div class="back-logo svg-fit">{{logo}}</div>

        <p class="headline">Tworzymy<br>strony WWW<br>dla ambitnych.</p>

        <div class="back-url">
            <span class="url mono"><span>netizo.pl</span><span class="url__sep">/</span><span>netizo.agency</span></span>
        </div>
    </section>
</body>
</html>
